<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formda — E-posta doğrulandı / Email verified</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #5b5b5b;
        --accent: #2f6f4f;
        --accent-contrast: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --muted: #b8b8b8;
          --accent: #7fd6a6;
          --accent-contrast: #0d1f16;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 420px;
      }
      .check {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.35rem;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-weight: 400;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      .open-app {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-contrast);
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
      }
      .open-app:active {
        opacity: 0.85;
      }
      .fallback {
        margin-top: 1.25rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check" aria-hidden="true">✅</div>

      <h1>E-postan doğrulandı!</h1>
      <h2>Your email is verified!</h2>

      <p>
        Artık Formda'ya giriş yapabilirsin.<br />
        You can now sign in to Formda.
      </p>

      <a class="open-app" href="formda://">Uygulamayı aç / Open the app</a>

      <p class="fallback">
        Buton çalışmazsa Formda uygulamasını elle açabilirsin.<br />
        If the button doesn't work, open the Formda app manually.
      </p>
    </div>
  </body>
</html>
